<style>
:root{--navy:#1F2D4A;--terra:#C97B5F;--bg:#F6F2EE;--card:#fff;--tx:#1F2D4A;--mut:#6b7488;--bd:#e4ddd5;--fh:Fraunces,Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2c;--card:#1F2D4A;--tx:#f3ece6;--mut:#a3adc2;--bd:#34446a}}
:root[data-theme="dark"]{--bg:#121a2c;--card:#1F2D4A;--tx:#f3ece6;--mut:#a3adc2;--bd:#34446a}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Lato,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;font-family:var(--fh);font-weight:700;font-size:21px;line-height:1.15}
header b{color:var(--terra)}header small{display:block;font:400 12px Lato,sans-serif;color:#b9c2d6;letter-spacing:.3px}
main{max-width:980px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;gap:4px}
nav button{flex:1;max-width:160px;background:none;border:0;color:#b9c2d6;padding:6px;border-radius:10px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{background:var(--terra);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2,h3{font-family:var(--fh)}h2{margin:6px 0 10px;font-size:22px}h3{margin:14px 0 6px;font-size:17px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.del{background:#a8402f}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pl{display:flex;gap:10px;align-items:center;cursor:pointer}.pl small,.mut{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.chip{flex:none;display:flex;gap:6px;align-items:center;border:2px solid var(--bd);background:var(--card);border-radius:30px;padding:3px 10px 3px 3px;cursor:pointer;color:var(--tx);font:inherit;font-size:14px}.chip .av{width:30px;height:30px;font-size:12px}
.chip.on,.tab.on{border-color:var(--terra);background:var(--terra);color:#fff}
.tab{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;font:inherit;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;position:relative;cursor:pointer;user-select:none}
.tile:active{background:var(--terra);color:#fff}.tile b{display:block;font:700 30px/1.1 var(--fh)}.tile small{font-size:12px}
.tile i{position:absolute;right:4px;top:4px;font-style:normal;width:28px;height:28px;line-height:26px;border:1px solid var(--bd);border-radius:50%;color:var(--mut)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:700;white-space:normal;line-height:1.15;vertical-align:bottom;min-width:46px}th:first-child{min-width:0;white-space:nowrap}tr.sel td,tr.sel td:first-child{background:color-mix(in srgb,var(--terra) 30%,var(--card))}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.t td{font-weight:700;color:var(--terra)}tr[data-a]{cursor:pointer}
input,select,textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
dialog{overflow:auto;border:0;border-radius:16px;padding:16px;width:min(420px,92vw);background:var(--card);color:var(--tx);max-height:90vh}dialog::backdrop{background:#0008}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.cv{font-size:11px;fill:var(--tx)}.cl{font-size:10px;fill:var(--mut)}.bar{fill:var(--terra)}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.empty{text-align:center;color:var(--mut);padding:30px 10px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:auto}.sn{width:70px;text-align:center}
#intro{position:fixed;inset:0;z-index:100;background:#F6F1EA;transition:opacity .5s;cursor:pointer}#intro svg{display:block;width:100%;height:100%}#intro p{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;margin:0;font:400 13px Lato,sans-serif;color:#4A5873;opacity:.7}
.ro .edit{display:none!important}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.by{margin:28px 0 10px;text-align:center;font-size:12px;color:var(--mut)}.by a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:700}.by svg{width:14px;height:14px;fill:var(--terra)}
</style></head><body>
<header>🏐 Rally <b>Radar</b><small>Spot the stats that win sets</small></header><main id="app"></main><nav id="nav"></nav><dialog id="dlg"></dialog><div id="toast"></div><div id="intro" onclick="introEnd()"><svg id="i_s" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Rally Radar intro: seven volleyball player silhouettes flash by, then a radar sweeps around a volleyball and the name and tagline appear">
<defs><clipPath id="i_bc"><circle cx="100" cy="100" r="38"/></clipPath></defs>

<g id="i_blips"><circle cx="140" cy="52" r="6" fill="#C97B5F"/><circle cx="158" cy="74" r="3.5" fill="#C97B5F" opacity=".55"/></g>
<g id="i_ball"><circle cx="100" cy="100" r="38" fill="#F6F1EA"/>
<g clip-path="url(#i_bc)" fill="none" stroke="#1F2D4A" stroke-width="2.2" stroke-linecap="round">
<g><path d="M78 70 C 92 74 104 86 108 104"/><path d="M88 64 C 102 68 114 80 118 98"/><path d="M98 62 C 112 64 124 76 126 92"/></g>
<g transform="rotate(120 100 100)"><path d="M78 70 C 92 74 104 86 108 104"/><path d="M88 64 C 102 68 114 80 118 98"/><path d="M98 62 C 112 64 124 76 126 92"/></g>
<g transform="rotate(240 100 100)"><path d="M78 70 C 92 74 104 86 108 104"/><path d="M88 64 C 102 68 114 80 118 98"/><path d="M98 62 C 112 64 124 76 126 92"/></g>
</g>
<circle cx="100" cy="100" r="38" fill="none" stroke="#1F2D4A" stroke-width="5"/></g>
</g>
<text id="i_name" x="200" y="460" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="46" fill="#1F2D4A">Rally <tspan fill="#B4603F">Radar</tspan></text>
<text id="i_tag" x="200" y="496" text-anchor="middle" font-family="Lato,Arial,sans-serif" font-size="16" fill="#4A5873">Spot the stats that win sets</text>
</g>
</svg><p>Tap to skip</p></div>
<script>
const K=['pts','sg','sb','ace','kill','att','mk','rg','rb','blk','dig','bd','ast'];
const L={pts:'Points',sg:'Good serves',sb:'Missed serves',ace:'Aces',kill:'Kills',att:'Attempted kills',mk:'Missed kills',rg:'Good reception',rb:'Bad reception',blk:'Blocks',dig:'Good defence',bd:'Bad defence',ast:'Set assists'};
const POS=['Setter','Outside hitter','Opposite','Middle blocker','Libero','Defensive specialist','Other'];
const pc=(a,b)=>b?Math.round(a/b*100):0;
const DER={'Serve %':s=>pc(s.sg,s.sg+s.sb),'Reception %':s=>pc(s.rg,s.rg+s.rb),'Kill %':s=>pc(s.kill,s.kill+s.att+s.mk)};
const M=[...K.map(k=>[L[k],s=>s[k]]),...Object.entries(DER)];
const empty=()=>Object.fromEntries(K.map(k=>[k,0]));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const mkT=n=>({id:uid(),name:n,players:[],matches:[]}),mkSet=()=>({s:{},l:[],us:'',them:''});
let S={teams:[mkT('My team')],cur:null},T,db=null,ui={tab:'matches',mid:null,set:0,pid:null,mode:'total',sp:null,sm:null,ss:'all',by:'match',mi:0,ct:'bar',xf:'pdf',xs:null,xt:true};
const setT=()=>{T=S.teams.find(t=>t.id===S.cur)||S.teams[0];S.cur=T.id};setT();
const $=id=>document.getElementById(id),P=id=>T.players.find(p=>p.id===id),cm=()=>T.matches.find(m=>m.id===ui.mid);
/* storage: IndexedDB (no app-imposed limits) */
async function load(){try{navigator.storage?.persist?.();db=await new Promise(r=>{const q=indexedDB.open('volley',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(!db)return;let v=await new Promise(r=>{const q=db.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
if(v&&v.players){const t=mkT('My team');t.players=v.players;t.matches=v.matches.map(m=>({...m,notes:'',sets:m.sets.map(s=>({...mkSet(),s}))}));v={teams:[t]}}
if(v&&v.teams&&v.teams.length){S=v;setT()}}catch(e){db=null}}
function save(n){try{db&&db.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){}if(!n)sync()}
function agg(pid,ms,si){const t=empty();ms.forEach(m=>m.sets.forEach((st,i)=>{if(si!=null&&i!==si)return;for(const id in st.s){if(pid&&id!==pid)continue;K.forEach(k=>t[k]+=st.s[id][k]||0)}}));return t}
const vals=s=>[...K.map(k=>s[k]),...Object.values(DER).map(f=>f(s)+'%')],cols=()=>[...K.map(k=>L[k]),...Object.keys(DER)],mlab=m=>`${m.date} vs ${m.opp}`,dshort=m=>m.date.slice(8)+'.'+m.date.slice(5,7);
const sc=st=>st.us!==''&&st.them!==''&&st.us!=null&&st.them!=null&&!isNaN(st.us)&&!isNaN(st.them);
function res(m){let w=0,l=0;m.sets.forEach(st=>{if(sc(st)){if(+st.us>+st.them)w++;else if(+st.us<+st.them)l++}});return{w,l}}
const rlab=m=>{const r=res(m);return r.w+r.l?`${r.w>r.l?'W':r.w<r.l?'L':'T'} ${r.w}–${r.l}`:''};
function record(){let W=0,Lo=0,sw=0,sl=0;T.matches.forEach(m=>{const r=res(m);if(r.w+r.l){r.w>r.l?W++:r.w<r.l&&Lo++;sw+=r.w;sl+=r.l}});return W+Lo?`Record ${W}–${Lo} · sets ${sw}–${sl}`:''}
function shrink(f,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(f)})}
const av=p=>p.photo?`<img class="av" src="${p.photo}" alt="">`:`<span class="av">${esc(p.num||'#')}</span>`;
const FOOT=`<footer class="by">Created by <a href="https://github.com/CarolinaCorona" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Carolina Corona</a></footer>`;
const nm=p=>p.photo?`<b>${esc(p.num)}</b> ${esc(p.name)}`:esc(p.name);
function table(rows){return `<div class="sc"><table><tr><th></th>${cols().map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${r.t?'t':''}${r.id&&r.id===ui.pid?' sel':''}" ${r.id?`data-a="selP" data-id="${r.id}"`:''}><td>${esc(r.l)}</td>${vals(r.s).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`}
function chart(rows){const f=M[ui.mi][1],v=rows.map(r=>f(r.s)),mx=Math.max(1,...v),w=Math.max(320,rows.length*64),ln=ui.ct==='line',Y=x=>140-x/mx*110;
const g=v.map((x,i)=>{const X=i*64+32;return (ln?`<circle class="bar" cx="${X}" cy="${Y(x)}" r="4"/>`:`<rect class="bar" x="${X-18}" y="${Y(x)}" width="36" height="${x/mx*110}" rx="4"/>`)+`<text class="cv" x="${X}" y="${Y(x)-7}" text-anchor="middle">${x}</text><text class="cl" x="${X}" y="160" text-anchor="middle">${esc((rows[i].k||'').slice(0,10))}</text><text class="cl" x="${X}" y="172" text-anchor="middle">${esc(rows[i].d||'')}</text>`}).join('');
return `<h3>Chart</h3><div class="row f"><select data-c="mi" style="max-width:220px">${M.map((m,i)=>`<option value="${i}" ${i==ui.mi?'selected':''}>${m[0]}</option>`).join('')}</select><select data-c="ct" style="max-width:140px"><option value="bar">Bars</option><option value="line" ${ln?'selected':''}>Trend line</option></select></div><div class="sc"><svg viewBox="0 0 ${w} 180" width="${w}" height="180" style="min-width:100%" role="img" aria-label="Chart">${ln?`<polyline fill="none" stroke="var(--terra)" stroke-width="3" points="${v.map((x,i)=>`${i*64+32},${Y(x)}`).join(' ')}"/>`:''}${g}</svg></div>`}
/* views */
function R(){const t=ui.tab;$('nav').innerHTML=[['matches','🏐','Matches'],['players','👥','Players'],['stats','📊','Stats'],['export','📤','Data']].map(([k,i,n])=>`<button data-a="tab" data-t="${k}" class="${t===k?'on':''}"><span>${i}</span>${n}</button>`).join('');
document.body.classList.toggle('ro',ro());const inM=t==='matches'&&ui.mid&&cm();
$('app').innerHTML=(inM?'':`<div class="row f"><select data-c="team" style="flex:1">${S.teams.map(x=>`<option value="${x.id}" ${x.id===T.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn alt" data-a="teams">⚙ Teams</button>${T.cloud?`<small class="mut">${ro()?'👁 View only':'☁ Synced'}</small>`:''}</div>`)+(inM?vMatch():t==='matches'?vMatches():t==='players'?vPlayers():t==='stats'?vStats():vExport())+(inM?'':FOOT)}
function vMatches(){return `<div class="row sp"><h2>Matches</h2><button class="btn edit" data-a="newM">+ New match</button></div>${T.matches.length?[...T.matches].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="card pl" data-a="open" data-id="${m.id}"><div><b>vs ${esc(m.opp)}</b> <b style="color:var(--terra)">${rlab(m)}</b><br><small>${m.date} · ${m.sets.length} set${m.sets.length>1?'s':''} · ${agg(null,[m]).pts} pts · ${(m.photos||[]).length} photos${m.notes?' · 📝':''}</small></div></div>`).join(''):'<div class="empty">No matches yet. Add your players first, then create a match.</div>'}`}
function vMatch(){const m=cm(),st=m.sets[ui.set<m.sets.length?ui.set:(ui.set=0)],pl=st.l.length?T.players.filter(p=>st.l.includes(p.id)):T.players;if(!pl.find(p=>p.id===ui.pid))ui.pid=pl[0]?.id||null;const s=ui.pid&&st.s[ui.pid]||empty();
const rows=T.players.filter(p=>st.s[p.id]&&K.some(k=>st.s[p.id][k])).map(p=>({id:p.id,l:`#${p.num} ${p.name}`,s:{...empty(),...st.s[p.id]}}));rows.push({l:'Set total',s:agg(null,[m],ui.set),t:1});
return `<div class="row sp"><button class="btn alt" data-a="back">← Back</button><span class="edit"><button class="btn alt" data-a="newM" data-id="${m.id}">Edit</button> <button class="btn del" data-a="delM">Delete</button></span></div><h2>vs ${esc(m.opp)} <small class="mut">${m.date} ${rlab(m)}</small></h2>
<div class="row" style="margin-bottom:10px">${m.sets.map((_,i)=>`<button class="tab ${i===ui.set?'on':''}" data-a="setSel" data-i="${i}">Set ${i+1}</button>`).join('')}<button class="tab edit" data-a="addSet">+ Set</button><button class="tab edit" data-a="lineup">Lineup${st.l.length?' ('+st.l.length+')':''}</button></div>
<div class="row f">Set ${ui.set+1} score: <input class="sn" type="number" inputmode="numeric" placeholder="Us" value="${esc(st.us)}" data-c="us" ${ro()?'readonly':''}> – <input class="sn" type="number" inputmode="numeric" placeholder="Them" value="${esc(st.them)}" data-c="them" ${ro()?'readonly':''}></div>
${T.players.length?`${ro()?`<h3 style="margin:4px 0 6px">${st.l.length?'Lineup':'Players'}</h3>`:''}<div class="chips">${pl.map(p=>`<button class="chip ${p.id===ui.pid?'on':''}" data-a="selP" data-id="${p.id}">${av(p)}<span>${nm(p)}</span></button>`).join('')}</div>
<div class="tiles edit">${K.map(k=>`<div class="tile" data-a="inc" data-k="${k}" data-d="1"><i data-a="inc" data-k="${k}" data-d="-1">−</i><b>${s[k]||0}</b><small>${L[k]}</small></div>`).join('')}</div>
